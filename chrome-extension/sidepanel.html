<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Annotations</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body class="app">
    <header class="header">
      <div class="header-left">
        <div class="header-sub" id="activeRouteDisplay">URL: —</div>
      </div>
      <div class="header-right">
        <span id="connStatusLabel" class="conn-status is-err" role="status" aria-live="polite" title="Receiver connection">[OFFLINE]</span>
        <button id="refreshTab" class="hdr-btn" title="Refresh" type="button" aria-label="Refresh">↻</button>
        <button id="openSettings" class="hdr-btn" title="Settings" type="button" aria-label="Settings">⋯</button>
      </div>
    </header>

    <main class="main">
      <section class="section">
        <div class="annotate-row">
          <div class="annotate-title">Annotate mode</div>
          <label class="switch" aria-label="Annotate mode">
            <input type="checkbox" id="annotateToggle" />
            <span class="track" aria-hidden="true"><span class="thumb"></span></span>
          </label>
        </div>
        <div class="inline-error" id="annotateError" hidden></div>
      </section>

      <section class="section">
        <div class="section-head">
          <div class="section-title">Capture</div>
        </div>
        <div class="action-grid">
          <button id="attachScreenshot" class="action-btn" type="button">
            <svg class="action-ico" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
              <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
              <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
              <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
            <span class="btn-text action-text">FULLSCREEN</span>
          </button>
          <button id="attachElementShot" class="action-btn" type="button">
            <svg class="action-ico" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m16 18 6-6-6-6"/>
              <path d="m8 6-6 6 6 6"/>
            </svg>
            <span class="btn-text action-text">ELEMENT</span>
          </button>
          <button id="clearAttachments" class="action-btn" type="button" title="Clear attachments">
            <svg class="action-ico" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
              <path d="M3 6h18"/>
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            <span class="btn-text action-text">CLEAR</span>
          </button>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div class="section-title">Selected Element</div>
          <div class="section-actions">
            <button id="clearSelected" class="text-btn" type="button" title="Clear selected element" aria-label="Clear selected element" hidden>X</button>
          </div>
        </div>
        <div class="pane-selected" id="selectedSummary">[ NONE ]</div>
      </section>

      <section class="section" id="attachmentsSection" hidden>
        <div class="section-head">
          <div class="section-title">Attachments</div>
        </div>
        <div id="attachments" class="attachments"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <div class="section-title">Comment</div>
        </div>
        <textarea id="comment" class="comment" rows="3" placeholder="Type annotation here... (Tip: paste an image to attach it)"></textarea>
      </section>

      <section class="section">
        <div class="section-head">
          <div class="section-title">Annotation type</div>
        </div>
        <div class="sev-group" role="radiogroup" aria-label="Annotation type">
          <button class="sev-btn sev-bug" type="button" data-sev="bug">
            <span>BUG</span>
          </button>
          <button class="sev-btn sev-feature" type="button" data-sev="feature">
            <span>NEW FEATURE</span>
          </button>
          <button class="sev-btn sev-info" type="button" data-sev="info">
            <span>REQUEST</span>
          </button>
        </div>
        <select id="severity" class="sr-only" aria-label="Annotation type (hidden)">
          <option value="info">info</option>
          <option value="feature">feature</option>
          <option value="bug">bug</option>
        </select>
      </section>

      <section class="section">
        <div class="section-head">
          <div class="section-title">Unresolved</div>
          <button id="refreshList" class="text-btn" type="button">REFRESH</button>
        </div>
        <div id="list" class="list"></div>
      </section>

      <dialog id="detailDialog" class="dialog">
        <div class="dialog-header">
          <div class="dialog-title">Annotation</div>
          <button id="closeDetail" class="icon-btn ghost" title="Close" type="button">✕</button>
        </div>
        <div class="dialog-body">
          <div class="kv">
            <div class="k">ID</div>
            <div class="v mono" id="detailId">—</div>
          </div>
          <div class="kv">
            <div class="k">Locator</div>
            <div class="v mono" id="detailLocator">—</div>
          </div>
          <div class="kv">
            <div class="k">Comment</div>
            <div class="v" id="detailComment">—</div>
          </div>
          <div class="kv">
            <div class="k">Attachments</div>
            <div class="v mono" id="detailAttachments">—</div>
          </div>
          <div class="action-row">
            <button id="copyPrompt" class="btn btn-ghost grow" type="button">Copy as prompt</button>
            <button id="markResolved" class="btn btn-primary grow" type="button">Resolve</button>
          </div>
          <div class="muted tiny" id="detailHint"></div>
        </div>
      </dialog>

      <dialog id="assetDialog" class="dialog dialog-asset">
        <div class="dialog-header">
          <div class="dialog-title mono" id="assetTitle">Attachment</div>
          <button id="closeAsset" class="icon-btn ghost" title="Close" type="button">✕</button>
        </div>
        <div class="dialog-body dialog-asset-body">
          <div class="muted tiny" id="assetMeta">—</div>
          <img id="assetImg" class="asset-img" alt="" />
        </div>
      </dialog>

      <dialog id="settingsDialog" class="dialog">
        <div class="dialog-header">
          <div class="dialog-title">Settings</div>
          <button id="closeSettings" class="icon-btn ghost" title="Close" type="button">✕</button>
        </div>
        <div class="dialog-body">
          <div class="dialog-section">
            <div class="dialog-section-title">Receiver</div>
            <label class="field">
              <span class="field-label">Server URL</span>
              <input id="serverUrl" class="field-input" placeholder="http://localhost:8787" />
            </label>
            <div class="muted tiny">Current: <span class="mono" id="serverUrlDisplay">—</span></div>
          </div>

          <div class="dialog-section">
            <div class="dialog-section-title">Auth</div>
            <label class="field">
              <span class="field-label">Token</span>
              <input id="token" class="field-input mono" type="password" placeholder="Token" />
            </label>
            <label class="check">
              <input id="showToken" type="checkbox" />
              <span>Show token</span>
            </label>
          </div>

          <div class="dialog-section">
            <div class="dialog-section-title">Diagnostics</div>
            <div class="dialog-actions">
              <button id="saveSettings" class="btn" type="button">Save</button>
              <button id="testConn" class="btn" type="button">Test connection</button>
            </div>
            <div class="muted tiny" id="settingsHint"></div>
          </div>
        </div>
      </dialog>
    </main>

    <footer class="footer">
      <button id="send" class="send-btn" type="button">
        <span class="send-text">SEND ANNOTATION</span>
        <span class="send-arrow" aria-hidden="true">→</span>
      </button>
    </footer>

    <script src="sidepanel.js"></script>
  </body>
</html>
