<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Annotations</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/controls.css">
    <link rel="stylesheet" href="styles/content.css">
    <link rel="stylesheet" href="styles/dialogs.css">
  </head>
  <body class="app">
    <h1 class="sr-only">Agent Annotations</h1>
    <header class="header">
      <div class="header-left">
        <span id="connStatusLabel" class="conn-status is-err" role="status" aria-live="polite" title="Receiver connection">OFFLINE</span>
      </div>
      <div class="header-right">
        <button id="refreshTab" class="hdr-btn" title="Refresh" type="button" aria-label="Refresh">↻</button>
        <button id="openSettings" class="hdr-btn" title="Settings" type="button" aria-label="Settings">⋯</button>
        <label class="switch hdr-switch" aria-label="Annotate mode">
          <input type="checkbox" id="annotateToggle">
          <span class="track" aria-hidden="true"><span class="thumb"></span></span>
        </label>
      </div>
    </header>

    <main class="main">
      <div class="inline-error" id="annotateError" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <div class="sr-only" id="actionStatus" role="status" aria-live="polite" aria-atomic="true"></div>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Capture</h2>
        </div>
        <div class="action-grid">
          <button id="attachScreenshot" class="action-btn" type="button">
            <svg class="action-ico" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
              <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
              <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
              <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
            <span class="btn-text action-text">FULLSCREEN</span>
          </button>
          <button id="attachElementShot" class="action-btn" type="button">
            <svg class="action-ico" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m16 18 6-6-6-6"/>
              <path d="m8 6-6 6 6 6"/>
            </svg>
            <span class="btn-text action-text">ELEMENT</span>
          </button>
          <button id="clearAttachments" class="action-btn" type="button" title="Clear attachments">
            <svg class="action-ico" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
              <path d="M3 6h18"/>
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            <span class="btn-text action-text">CLEAR</span>
          </button>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Selected Element</h2>
          <div class="section-actions">
            <button id="clearSelected" class="text-btn" type="button" title="Clear selected element" aria-label="Clear selected element" hidden>X</button>
          </div>
        </div>
        <div class="pane-selected" id="selectedSummary">[ NONE ]</div>
      </section>

      <section class="section" id="attachmentsSection" hidden>
        <div class="section-head">
          <h2 class="section-title">Attachments</h2>
        </div>
        <div id="attachments" class="attachments"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title"><label for="comment">Comment</label></h2>
        </div>
        <textarea id="comment" name="comment" class="comment" rows="3" placeholder="Type annotation here…" aria-describedby="commentHint"></textarea>
        <div id="commentHint" class="help">Paste an image to attach it.</div>
      </section>

      <fieldset class="section choice-fieldset">
        <legend class="section-title">Annotation type</legend>
        <div class="sev-group">
          <label class="sev-btn sev-bug" data-sev="bug">
            <input class="sr-only" type="radio" name="severityChoice" value="bug">
            <span>BUG</span>
          </label>
          <label class="sev-btn sev-feature" data-sev="feature">
            <input class="sr-only" type="radio" name="severityChoice" value="feature">
            <span>NEW FEATURE</span>
          </label>
          <label class="sev-btn sev-info" data-sev="info">
            <input class="sr-only" type="radio" name="severityChoice" value="info" checked>
            <span>REQUEST</span>
          </label>
        </div>
      </fieldset>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Unresolved</h2>
          <button id="refreshList" class="text-btn" type="button">REFRESH</button>
        </div>
        <div id="list" class="list" aria-live="polite"></div>
      </section>

      <dialog id="detailDialog" class="dialog" aria-labelledby="detailDialogTitle">
        <div class="dialog-header">
          <h2 class="dialog-title" id="detailDialogTitle">Annotation</h2>
          <button id="closeDetail" class="icon-btn ghost" type="button" aria-label="Close annotation details">✕</button>
        </div>
        <div class="dialog-body">
          <div class="kv">
            <div class="k">ID</div>
            <div class="v mono" id="detailId">—</div>
          </div>
          <div class="kv">
            <div class="k">Locator</div>
            <div class="v mono" id="detailLocator">—</div>
          </div>
          <div class="kv">
            <div class="k">Comment</div>
            <div class="v" id="detailComment">—</div>
          </div>
          <div class="kv">
            <div class="k">Attachments</div>
            <div class="v mono" id="detailAttachments">—</div>
          </div>
          <div class="action-row">
            <button id="copyPrompt" class="btn btn-ghost grow" type="button">Copy as prompt</button>
            <button id="markResolved" class="btn btn-primary grow" type="button">Resolve</button>
          </div>
          <div class="muted tiny" id="detailHint" role="status" aria-live="polite" aria-atomic="true"></div>
        </div>
      </dialog>

      <dialog id="assetDialog" class="dialog dialog-asset" aria-labelledby="assetTitle">
        <div class="dialog-header">
          <h2 class="dialog-title mono" id="assetTitle">Attachment</h2>
          <button id="closeAsset" class="icon-btn ghost" type="button" aria-label="Close attachment preview">✕</button>
        </div>
        <div class="dialog-body dialog-asset-body">
          <div class="muted tiny" id="assetMeta">—</div>
          <img id="assetImg" class="asset-img" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="">
        </div>
      </dialog>

      <dialog id="settingsDialog" class="dialog" aria-labelledby="settingsDialogTitle">
        <div class="dialog-header">
          <h2 class="dialog-title" id="settingsDialogTitle">Settings</h2>
          <button id="closeSettings" class="icon-btn ghost" type="button" aria-label="Close settings">✕</button>
        </div>
        <div class="dialog-body">
          <div class="dialog-section">
            <h3 class="dialog-section-title">Receiver</h3>
            <div class="field">
              <label class="field-label" for="serverUrl">Server URL</label>
              <input id="serverUrl" name="serverUrl" class="field-input" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="http://localhost:8787">
            </div>
            <div class="muted tiny">Current: <span class="mono" id="serverUrlDisplay">—</span></div>
          </div>

          <div class="dialog-section">
            <h3 class="dialog-section-title">Auth</h3>
            <div class="field">
              <label class="field-label" for="token">Token</label>
              <input id="token" name="token" class="field-input mono" type="password" autocomplete="new-password" spellcheck="false" placeholder="Token">
            </div>
            <label class="check">
              <input id="showToken" name="showToken" type="checkbox">
              <span>Show token</span>
            </label>
          </div>

          <div class="dialog-section">
            <h3 class="dialog-section-title">Diagnostics</h3>
            <div class="dialog-actions">
              <button id="saveSettings" class="btn" type="button">Save</button>
              <button id="testConn" class="btn" type="button">Test connection</button>
            </div>
            <div class="muted tiny" id="settingsHint" role="status" aria-live="polite" aria-atomic="true"></div>
          </div>
        </div>
      </dialog>
    </main>

    <footer class="footer">
      <button id="send" class="send-btn" type="button">
        <span class="send-text">SAVE ANNOTATION</span>
        <span class="send-arrow" aria-hidden="true">→</span>
      </button>
    </footer>

    <script type="module" src="sidepanel/main.js"></script>
  </body>
</html>
