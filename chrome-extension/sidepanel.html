<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Annotations</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body class="app">
    <span id="activeRoute" class="sr-only">—</span>
    <div class="conn-bar" role="status" aria-live="polite">
      <div class="conn-left">
        <svg class="conn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 17H7A5 5 0 0 1 7 7h2"/>
          <path d="M15 7h2a5 5 0 1 1 0 10h-2"/>
          <line x1="8" x2="16" y1="12" y2="12"/>
        </svg>
        <span class="mono conn-url" id="serverUrlDisplay">—</span>
      </div>
      <div class="conn-right">
        <button id="refreshTab" class="icon-btn ghost" title="Refresh tab" type="button" aria-label="Refresh tab">
          ↻
        </button>
        <span class="conn-dot" id="connDot" title="Receiver connection"></span>
        <span class="conn-text" id="connText">—</span>
      </div>
    </div>

    <main class="main">
      <section class="rowblock">
        <div class="rowblock-left">
          <div class="rowblock-title">Annotate Mode</div>
          <div class="rowblock-sub">Select elements to highlight</div>
        </div>
        <label class="switch" aria-label="Annotate mode">
          <input type="checkbox" id="annotateToggle" />
          <span class="track" aria-hidden="true"><span class="thumb"></span></span>
        </label>
      </section>

      <section class="rowblock actions">
        <div class="action-row">
          <button id="attachScreenshot" class="btn btn-outline" type="button">
            <svg class="btn-ico" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
              <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
              <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
              <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
            <span class="btn-text">Fullscreen</span>
          </button>
          <button id="attachElementShot" class="btn btn-outline" type="button">
            <svg class="btn-ico" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m16 18 6-6-6-6"/>
              <path d="m8 6-6 6 6 6"/>
            </svg>
            <span class="btn-text">Element</span>
          </button>
          <button id="clearAttachments" class="btn btn-outline btn-clear" type="button" title="Clear attachments">
            <svg class="btn-ico" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
              <path d="M3 6h18"/>
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            <span class="btn-text">Clear</span>
          </button>
        </div>
      </section>

      <section class="block">
        <div class="block-head">
          <div class="section-label">Selected Element</div>
          <div class="head-actions">
            <button id="changeSelected" class="link-btn" type="button">Change</button>
            <button id="clearSelected" class="icon-btn ghost" type="button" title="Clear selected element" aria-label="Clear selected element" hidden>✕</button>
          </div>
        </div>
        <div class="selected mono" id="selectedSummary">None</div>
      </section>

      <div id="attachments" class="attachments"></div>

      <section class="form">
        <div class="field-float">
          <textarea id="comment" rows="3" placeholder="Comment"></textarea>
          <label for="comment">Comment</label>
        </div>

          <div class="seg">
            <div class="section-label">Severity</div>
            <div class="pill-group" role="radiogroup" aria-label="Severity">
            <button class="pill-btn sev-bug" type="button" data-sev="bug">Bug</button>
            <button class="pill-btn sev-question" type="button" data-sev="question">Question</button>
            <button class="pill-btn sev-note" type="button" data-sev="note">Note</button>
            </div>
            <select id="severity" class="sr-only" aria-label="Severity (hidden)">
            <option value="note">note</option>
            <option value="question">question</option>
            <option value="bug">bug</option>
            </select>
          </div>
      </section>

      <section class="block">
        <div class="block-head">
          <div class="section-label">Open on this page</div>
          <button id="refreshList" class="link-btn" type="button">Refresh</button>
        </div>
        <div id="list" class="list"></div>
      </section>

      <details class="details" id="settingsDetails">
        <summary class="summary">
          <span class="section-label">Connection settings</span>
        </summary>

        <div class="details-body">
          <div class="field-float">
            <input id="serverUrl" placeholder="Server URL" />
            <label for="serverUrl">Server URL</label>
          </div>

          <div class="field-float">
            <input id="token" placeholder="Token" />
            <label for="token">Token</label>
          </div>

          <div class="action-row">
            <button id="saveSettings" class="btn btn-outline" type="button"><span class="btn-text">Save</span></button>
            <button id="testConn" class="btn btn-outline" type="button"><span class="btn-text">Test</span></button>
          </div>
        </div>
      </details>

      <dialog id="detailDialog" class="dialog">
        <div class="dialog-header">
          <div class="dialog-title">Annotation</div>
          <button id="closeDetail" class="icon-btn ghost" title="Close" type="button">✕</button>
        </div>
        <div class="dialog-body">
          <div class="kv">
            <div class="k">ID</div>
            <div class="v mono" id="detailId">—</div>
          </div>
          <div class="kv">
            <div class="k">Locator</div>
            <div class="v mono" id="detailLocator">—</div>
          </div>
          <div class="kv">
            <div class="k">Comment</div>
            <div class="v" id="detailComment">—</div>
          </div>
          <div class="kv">
            <div class="k">Attachments</div>
            <div class="v mono" id="detailAttachments">—</div>
          </div>
          <div class="action-row">
            <button id="copyPrompt" class="btn btn-ghost grow" type="button">Copy as prompt</button>
            <button id="markResolved" class="btn btn-primary grow" type="button">Resolve</button>
          </div>
          <div class="muted tiny" id="detailHint"></div>
        </div>
      </dialog>

      <dialog id="assetDialog" class="dialog dialog-asset">
        <div class="dialog-header">
          <div class="dialog-title mono" id="assetTitle">Attachment</div>
          <button id="closeAsset" class="icon-btn ghost" title="Close" type="button">✕</button>
        </div>
        <div class="dialog-body dialog-asset-body">
          <div class="muted tiny" id="assetMeta">—</div>
          <img id="assetImg" class="asset-img" alt="" />
        </div>
      </dialog>
    </main>

    <footer class="footer">
      <button id="send" class="send-btn" type="button">
        <span class="send-text">Send annotation</span>
        <svg class="send-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z"/>
          <path d="M6 12h16"/>
        </svg>
      </button>
    </footer>

    <script src="sidepanel.js"></script>
  </body>
</html>
